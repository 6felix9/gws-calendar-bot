name: Sync secrets to Railway

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
      GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
      GWS_CLIENT_SECRET: ${{ secrets.GWS_CLIENT_SECRET }}
    steps:
      - name: Sync GitHub secrets to Railway service variables
        run: |
          set -eu
          railway variable set \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            OWNER_TELEGRAM_ID="$OWNER_TELEGRAM_ID" \
            --service gws-calendar-bot
          printf '%s' "$GWS_CREDENTIALS" | railway variable set GWS_CREDENTIALS --stdin --service gws-calendar-bot
          printf '%s' "$GWS_CLIENT_SECRET" | railway variable set GWS_CLIENT_SECRET --stdin --service gws-calendar-bot
