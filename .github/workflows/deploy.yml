name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: gws-calendar-bot
  REPO: gws-calendar-bot
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gws-calendar-bot/gws-calendar-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" .
          docker push --all-tags "${IMAGE}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --service-account "${SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com" \
            --no-allow-unauthenticated \
            --no-cpu-throttling \
            --min-instances 1 \
            --max-instances 1 \
            --cpu 1 --memory 512Mi \
            --set-env-vars "USER_TIMEZONE=Asia/Kuala_Lumpur" \
            --set-secrets "TELEGRAM_BOT_TOKEN=TELEGRAM_BOT_TOKEN:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OWNER_TELEGRAM_ID=OWNER_TELEGRAM_ID:latest,GWS_CREDENTIALS=GWS_CREDENTIALS:latest,GWS_CLIENT_SECRET=GWS_CLIENT_SECRET:latest"
