name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/felix-bot:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,TELEGRAM_BOT_TOKEN,OPENAI_API_KEY,GWS_CREDENTIALS
          script: |
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            mkdir -p /opt/felix
            echo "$GWS_CREDENTIALS" > /opt/felix/gws-credentials.json

            docker pull "$DOCKERHUB_USERNAME/felix-bot:latest"

            docker stop felix-bot || true
            docker rm felix-bot || true

            docker run -d \
              --name felix-bot \
              --restart unless-stopped \
              -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE=/gws-credentials.json \
              -e USER_TIMEZONE=Asia/Kuala_Lumpur \
              -v /opt/felix/gws-credentials.json:/gws-credentials.json:ro \
              "$DOCKERHUB_USERNAME/felix-bot:latest"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GWS_CREDENTIALS: ${{ secrets.GWS_CREDENTIALS }}
